name: Build CV PDF

on:
  push:
    branches: [main]
    paths: ["Longye_Chen_cv.tex", "cv_template.cls", ".github/workflows/build-cv.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Longye_Chen_cv.tex
          compiler: lualatex
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Longye_Chen_cv.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild Longye_Chen_cv.pdf"
          git push
